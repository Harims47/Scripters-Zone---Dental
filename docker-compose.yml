version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dentalcore_db
    restart: always
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dentalpassword
      POSTGRES_DB: dentalcore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
